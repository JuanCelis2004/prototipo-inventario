<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JC Inventario · Consola de Operaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg0:#090D16; --bg1:#0F1524; --bg2:#141C2E;
    --glass:rgba(255,255,255,.045); --glass2:rgba(255,255,255,.07); --brd:rgba(255,255,255,.09);
    --ink:#EAF0FA; --muted:#8793AB; --faint:#59657E;
    --amber:#F5A524; --amber2:#FF8A1E; --emerald:#34D399; --teal:#2DD4BF;
    --coral:#FB7185; --rose:#F43F5E; --violet:#A78BFA; --sky:#38BDF8;
    --shadow:0 24px 50px -24px rgba(0,0,0,.7);
    --r:18px;
    font-family:"Inter",system-ui,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;color:var(--ink);background:var(--bg0);
    background-image:
      radial-gradient(900px 500px at 12% -5%, rgba(245,165,36,.14), transparent 60%),
      radial-gradient(800px 600px at 100% 10%, rgba(167,139,250,.12), transparent 55%),
      radial-gradient(900px 700px at 50% 120%, rgba(45,212,191,.10), transparent 55%),
      linear-gradient(180deg,var(--bg0),var(--bg1));
    background-attachment:fixed;
  }
  h1,h2,h3,.brand{font-family:"Space Grotesk",Inter,sans-serif}
  ::selection{background:rgba(245,165,36,.3)}
  svg{display:block}
  .ic{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

  /* ---------- Glass card ---------- */
  .card{background:var(--glass);border:1px solid var(--brd);border-radius:var(--r);
    backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
    box-shadow:var(--shadow);padding:22px}

  /* ---------- Login ---------- */
  .login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
  .login{width:100%;max-width:400px;animation:rise .6s cubic-bezier(.2,.8,.2,1)}
  .logo-badge{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--amber),var(--amber2));color:#1a1203;
    box-shadow:0 10px 30px -8px rgba(245,165,36,.6);margin-bottom:18px}
  .login h1{font-size:23px;letter-spacing:-.4px}
  .login .sub{color:var(--muted);font-size:13.5px;margin:4px 0 22px}
  label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px;font-weight:500}
  input,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--brd);
    background:rgba(255,255,255,.03);color:var(--ink);font-size:14px;font-family:inherit;transition:all .25s}
  input:focus,select:focus{outline:none;border-color:rgba(245,165,36,.55);background:rgba(245,165,36,.06);
    box-shadow:0 0 0 4px rgba(245,165,36,.12)}
  input::placeholder{color:var(--faint)}
  option{background:var(--bg2);color:var(--ink)}

  .btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;cursor:pointer;
    border:none;border-radius:12px;padding:12px 18px;font-weight:600;font-size:14px;font-family:inherit;
    color:#1a1203;background:linear-gradient(135deg,var(--amber),var(--amber2));
    box-shadow:0 10px 24px -10px rgba(245,165,36,.65);transition:transform .25s,box-shadow .25s,filter .25s}
  .btn:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 16px 30px -12px rgba(245,165,36,.75);filter:brightness(1.05)}
  .btn:active{transform:translateY(0) scale(.99)}
  .btn.block{width:100%;margin-top:20px}
  .btn.ghost{background:rgba(255,255,255,.05);color:var(--ink);border:1px solid var(--brd);box-shadow:none}
  .btn.ghost:hover{background:rgba(255,255,255,.1);box-shadow:none}
  .hint{font-size:12px;color:var(--faint);margin-top:16px;line-height:1.6}
  .hint b{color:var(--muted)}

  /* ---------- App shell ---------- */
  .app{display:none;max-width:1240px;margin:0 auto;padding:20px 22px 60px}
  .topbar{position:sticky;top:14px;z-index:30;display:flex;align-items:center;justify-content:space-between;
    gap:16px;padding:14px 20px;margin-bottom:24px}
  .brand{display:flex;align-items:center;gap:13px}
  .brand .logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--amber),var(--amber2));color:#1a1203;flex:none;
    box-shadow:0 8px 20px -8px rgba(245,165,36,.6)}
  .brand .t{font-size:16px;font-weight:700;letter-spacing:-.3px;line-height:1.15}
  .brand .s{font-size:11.5px;color:var(--muted)}
  .userchip{display:flex;align-items:center;gap:11px}
  .avatar{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:14px;
    background:linear-gradient(135deg,var(--violet),#6D5BD0);color:#fff}
  .userchip .n{font-size:13px;font-weight:600;line-height:1.2}
  .userchip .r{font-size:10.5px;color:var(--amber);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
  .iconbtn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;cursor:pointer;
    background:rgba(255,255,255,.05);border:1px solid var(--brd);color:var(--muted);transition:all .25s}
  .iconbtn:hover{color:var(--ink);background:rgba(251,113,133,.14);border-color:rgba(251,113,133,.4);transform:scale(1.05)}

  /* ---------- KPIs ---------- */
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:24px}
  .kpi{position:relative;overflow:hidden;padding:18px}
  .kpi .top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:500}
  .kpi .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff}
  .kpi .val{font-family:"Space Grotesk";font-size:27px;font-weight:700;margin-top:12px;letter-spacing:-.5px}
  .kpi .cap{font-size:11.5px;color:var(--faint);margin-top:3px}
  .kpi::after{content:"";position:absolute;inset:0 0 auto 0;height:3px;opacity:.9}
  .kpi.a::after{background:linear-gradient(90deg,var(--amber),var(--amber2))}
  .kpi.a .ico{background:linear-gradient(135deg,var(--amber),var(--amber2));color:#1a1203}
  .kpi.e::after{background:linear-gradient(90deg,var(--teal),var(--emerald))}
  .kpi.e .ico{background:linear-gradient(135deg,var(--teal),var(--emerald))}
  .kpi.c::after{background:linear-gradient(90deg,var(--coral),var(--rose))}
  .kpi.c .ico{background:linear-gradient(135deg,var(--coral),var(--rose))}
  .kpi.v::after{background:linear-gradient(90deg,var(--violet),var(--sky))}
  .kpi.v .ico{background:linear-gradient(135deg,var(--violet),var(--sky))}
  .kpi.s::after{background:linear-gradient(90deg,var(--sky),var(--teal))}
  .kpi.s .ico{background:linear-gradient(135deg,var(--sky),var(--teal))}

  /* ---------- Layout grid ---------- */
  .grid{display:grid;grid-template-columns:1.65fr 1fr;gap:18px;align-items:start}
  .sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
  .sec-head h2{font-size:16px;font-weight:600;letter-spacing:-.2px;display:flex;align-items:center;gap:9px}
  .sec-head .accent{color:var(--amber)}

  /* ---------- Search + filters ---------- */
  .search{position:relative;flex:1;max-width:260px}
  .search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint);width:16px;height:16px}
  .search input{padding-left:36px;padding-top:9px;padding-bottom:9px}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
  .chip{padding:6px 13px;border-radius:999px;border:1px solid var(--brd);background:rgba(255,255,255,.03);
    color:var(--muted);font-size:12px;font-weight:500;cursor:pointer;transition:all .22s;white-space:nowrap}
  .chip:hover{color:var(--ink);transform:translateY(-1px)}
  .chip.on{background:linear-gradient(135deg,rgba(245,165,36,.2),rgba(255,138,30,.14));
    border-color:rgba(245,165,36,.5);color:#FCD9A0}

  /* ---------- Material rows ---------- */
  .mat{display:grid;grid-template-columns:1fr auto;gap:10px;padding:13px 14px;border-radius:14px;
    border:1px solid transparent;transition:all .22s;animation:fade .4s both}
  .mat+.mat{margin-top:7px}
  .mat:hover{background:rgba(255,255,255,.035);border-color:var(--brd);transform:translateX(2px)}
  .mat .nm{font-size:14px;font-weight:600;letter-spacing:-.1px}
  .mat .meta{font-size:11.5px;color:var(--faint);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
  .mat .meta .code{color:var(--muted);font-weight:600}
  .bar{height:6px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:9px;width:220px;max-width:40vw}
  .bar>i{display:block;height:100%;border-radius:999px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:7px;justify-content:center}
  .stock{font-family:"Space Grotesk";font-weight:700;font-size:16px}
  .stock small{color:var(--faint);font-weight:500;font-size:11px}

  .badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:10.5px;
    font-weight:700;letter-spacing:.03em;text-transform:uppercase}
  .badge .dot{width:6px;height:6px;border-radius:50%}
  .b-ok{background:rgba(52,211,153,.12);color:#6EE7B7}.b-ok .dot{background:var(--emerald);box-shadow:0 0 8px var(--emerald)}
  .b-bajo{background:rgba(245,165,36,.14);color:#FCD9A0}.b-bajo .dot{background:var(--amber);box-shadow:0 0 8px var(--amber)}
  .b-crit{background:rgba(251,113,133,.14);color:#FDA4AF}.b-crit .dot{background:var(--coral);box-shadow:0 0 9px var(--coral)}

  .val-tag{font-size:11px;color:var(--muted)}

  /* ---------- Movement form ---------- */
  .seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:rgba(255,255,255,.03);
    border:1px solid var(--brd);border-radius:12px;padding:5px}
  .seg button{border:none;background:transparent;color:var(--muted);padding:8px 4px;border-radius:9px;
    font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .22s;display:flex;align-items:center;justify-content:center;gap:5px}
  .seg button.on{background:linear-gradient(135deg,var(--amber),var(--amber2));color:#1a1203;
    box-shadow:0 6px 16px -8px rgba(245,165,36,.6)}

  /* ---------- Alerts ---------- */
  .alert{display:flex;gap:12px;padding:12px 13px;border-radius:13px;background:rgba(251,113,133,.06);
    border:1px solid rgba(251,113,133,.18);margin-bottom:9px;animation:fade .4s both}
  .alert .ai{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;
    background:rgba(251,113,133,.16);color:var(--coral)}
  .alert.bajo{background:rgba(245,165,36,.06);border-color:rgba(245,165,36,.2)}
  .alert.bajo .ai{background:rgba(245,165,36,.16);color:var(--amber)}
  .alert .nm{font-size:13px;font-weight:600}
  .alert .ds{font-size:11.5px;color:var(--muted);margin-top:2px}
  .alert .sug{font-size:11px;font-weight:700;color:var(--amber);margin-top:4px}
  .empty{text-align:center;color:var(--faint);font-size:13px;padding:24px 0}
  .empty .ic{width:30px;height:30px;margin:0 auto 10px;color:var(--emerald)}

  /* ---------- History ---------- */
  .hist{margin-top:18px}
  .mv{display:grid;grid-template-columns:auto 1fr auto auto;gap:14px;align-items:center;padding:11px 14px;
    border-radius:12px;transition:background .2s}
  .mv:hover{background:rgba(255,255,255,.03)}
  .mv+.mv{border-top:1px solid rgba(255,255,255,.05)}
  .mv .ti{width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
  .mv .tx{font-size:13px;font-weight:600}
  .mv .sb{font-size:11px;color:var(--faint);margin-top:2px}
  .mv .q{font-family:"Space Grotesk";font-weight:700;font-size:14px}
  .mv .dt{font-size:11px;color:var(--faint);text-align:right}
  .t-entrada{background:rgba(52,211,153,.14);color:var(--emerald)}
  .t-salida{background:rgba(251,113,133,.14);color:var(--coral)}
  .t-traslado{background:rgba(56,189,248,.14);color:var(--sky)}
  .t-ajuste{background:rgba(167,139,250,.14);color:var(--violet)}

  /* ---------- Toasts ---------- */
  .toasts{position:fixed;right:20px;bottom:20px;z-index:80;display:flex;flex-direction:column;gap:10px}
  .toast{display:flex;align-items:flex-start;gap:11px;padding:14px 16px;border-radius:13px;min-width:280px;max-width:380px;
    background:rgba(20,28,46,.86);border:1px solid var(--brd);backdrop-filter:blur(16px);box-shadow:var(--shadow);
    animation:slidein .4s cubic-bezier(.2,.8,.2,1)}
  .toast.out{animation:slideout .35s forwards}
  .toast .ti{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center}
  .toast.ok .ti{background:rgba(52,211,153,.16);color:var(--emerald)}
  .toast.err .ti{background:rgba(251,113,133,.16);color:var(--coral)}
  .toast.warn .ti{background:rgba(245,165,36,.16);color:var(--amber)}
  .toast .msg{font-size:13px;line-height:1.45}

  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes slidein{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
  @keyframes slideout{to{opacity:0;transform:translateX(30px)}}

  @media(max-width:960px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
  @media(max-width:520px){.kpis{grid-template-columns:1fr}.topbar{flex-wrap:wrap}}
</style>
</head>
<body>

<!-- ============== LOGIN ============== -->
<div id="loginWrap" class="login-wrap">
  <div class="login card">
    <div class="logo-badge"><svg class="ic" style="width:26px;height:26px"><use href="#i-box"/></svg></div>
    <h1>JC Inventario</h1>
    <p class="sub">Consola de operaciones · Gestión y control de inventarios</p>
    <label>Usuario</label>
    <input id="u" value="operador" autocomplete="username" />
    <label>Contraseña</label>
    <input id="p" type="password" value="operador123" autocomplete="current-password" />
    <button class="btn block" onclick="login()"><svg class="ic"><use href="#i-login"/></svg> Entrar</button>
    <p class="hint">Cuentas de prueba &nbsp;·&nbsp; <b>operador</b> / operador123 &nbsp;·&nbsp; <b>admin</b> / admin123</p>
  </div>
</div>

<!-- ============== APP ============== -->
<div id="app" class="app">
  <div class="topbar card" style="padding:12px 18px">
    <div class="brand">
      <div class="logo"><svg class="ic" style="width:24px;height:24px"><use href="#i-box"/></svg></div>
      <div><div class="t">JC Inventario</div><div class="s">Hidráulicas · Sanitarias · Gas</div></div>
    </div>
    <div class="userchip">
      <div class="avatar" id="avatar">–</div>
      <div><div class="n" id="uname">–</div><div class="r" id="urole">–</div></div>
      <div class="iconbtn" title="Salir" onclick="logout()"><svg class="ic"><use href="#i-logout"/></svg></div>
    </div>
  </div>

  <!-- KPIs -->
  <div class="kpis" id="kpis"></div>

  <!-- Main -->
  <div class="grid">
    <!-- Materiales -->
    <div class="card">
      <div class="sec-head">
        <h2><svg class="ic accent"><use href="#i-layers"/></svg> Inventario</h2>
        <div class="search"><svg class="ic"><use href="#i-search"/></svg><input id="q" placeholder="Buscar material, código…" oninput="debouncedLoad()" /></div>
      </div>
      <div class="chips" id="catChips"></div>
      <div class="chips" id="estadoChips" style="margin-top:-8px"></div>
      <div id="matList"></div>
    </div>

    <!-- Right column -->
    <div style="display:flex;flex-direction:column;gap:18px">
      <div class="card">
        <div class="sec-head"><h2><svg class="ic accent"><use href="#i-repeat"/></svg> Registrar movimiento</h2></div>
        <div class="seg" id="seg">
          <button data-t="salida" class="on" onclick="setTipo('salida')"><svg class="ic" style="width:14px;height:14px"><use href="#i-down"/></svg>Salida</button>
          <button data-t="entrada" onclick="setTipo('entrada')"><svg class="ic" style="width:14px;height:14px"><use href="#i-up"/></svg>Entrada</button>
          <button data-t="traslado" onclick="setTipo('traslado')"><svg class="ic" style="width:14px;height:14px"><use href="#i-pin"/></svg>Traslado</button>
          <button data-t="ajuste" onclick="setTipo('ajuste')"><svg class="ic" style="width:14px;height:14px"><use href="#i-sliders"/></svg>Ajuste</button>
        </div>
        <label>Material</label>
        <select id="mMat"></select>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div><label id="lblCant">Cantidad</label><input id="mCant" type="number" min="0" value="10" /></div>
          <div><label>Ubicación</label><input id="mUbic" placeholder="Frente Norte…" /></div>
        </div>
        <label>Motivo</label>
        <input id="mMot" placeholder="Ej: despacho a frente de obra" />
        <button class="btn block" onclick="registrar()"><svg class="ic"><use href="#i-check"/></svg> Registrar</button>
      </div>

      <div class="card">
        <div class="sec-head"><h2><svg class="ic accent"><use href="#i-alert"/></svg> Alertas de reposición</h2><span class="val-tag" id="repoVal"></span></div>
        <div id="alertList"></div>
      </div>
    </div>
  </div>

  <!-- History -->
  <div class="card hist">
    <div class="sec-head"><h2><svg class="ic accent"><use href="#i-activity"/></svg> Movimientos recientes</h2></div>
    <div id="histList"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<!-- SVG icon sprite (estilo Lucide) -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="i-box"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></g>
    <g id="i-login"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></g>
    <g id="i-logout"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></g>
    <g id="i-layers"><path d="M12 2l9 5-9 5-9-5z"/><path d="M3 12l9 5 9-5"/><path d="M3 17l9 5 9-5"/></g>
    <g id="i-search"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></g>
    <g id="i-repeat"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></g>
    <g id="i-alert"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></g>
    <g id="i-activity"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></g>
    <g id="i-check"><path d="M20 6L9 17l-5-5"/></g>
    <g id="i-down"><path d="M12 5v14"/><path d="M19 12l-7 7-7-7"/></g>
    <g id="i-up"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></g>
    <g id="i-pin"><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></g>
    <g id="i-sliders"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></g>
    <g id="i-coins"><circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/></g>
    <g id="i-package"><path d="M16.5 9.4L7.5 4.2"/><path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7L12 12l8.7-5M12 22V12"/></g>
    <g id="i-trend"><path d="M23 6l-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/></g>
    <g id="i-shield"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></g>
  </defs>
</svg>

<script>
  let token=null, user=null, tipo='salida', cat='', estado='';
  const $=(id)=>document.getElementById(id);
  const cop=(n)=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n||0);
  const api=(path,opts={})=>fetch(path,{...opts,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}) ,...(opts.headers||{})}});

  async function login(){
    const r=await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:$('u').value,password:$('p').value})});
    const d=await r.json();
    if(!r.ok){toast('err','No se pudo entrar: '+d.error);return;}
    token=d.token; user=d;
    $('avatar').textContent=(d.nombre||'?').slice(0,1).toUpperCase();
    $('uname').textContent=d.nombre; $('urole').textContent=d.rol;
    $('loginWrap').style.display='none'; $('app').style.display='block';
    $('mUbic').value='';
    await Promise.all([loadDash(),loadCats(),loadMats(),loadAlertas(),loadHist()]);
    toast('ok','Bienvenido, '+d.nombre);
  }
  function logout(){token=null;user=null;$('app').style.display='none';$('loginWrap').style.display='grid';}

  const KPI=[
    {k:'valor_inventario',cls:'a',ic:'i-coins',cap:'valorización total',money:true,lbl:'Valor inventario'},
    {k:'total_materiales',cls:'s',ic:'i-package',cap:'referencias activas',lbl:'Materiales'},
    {k:'alertas',cls:'c',ic:'i-alert',cap:'en o bajo reorden',lbl:'Alertas'},
    {k:'criticos',cls:'c',ic:'i-shield',cap:'stock crítico',lbl:'Críticos'},
    {k:'movimientos_hoy',cls:'v',ic:'i-trend',cap:'registrados hoy',lbl:'Mov. hoy'},
  ];
  async function loadDash(){
    const d=await(await api('/api/dashboard')).json();
    $('kpis').innerHTML=KPI.map(c=>{
      const v=d.kpis[c.k];
      return `<div class="kpi card ${c.cls}">
        <div class="top"><span>${c.lbl}</span><span class="ico"><svg class="ic"><use href="#${c.ic}"/></svg></span></div>
        <div class="val">${c.money?cop(v):v}</div><div class="cap">${c.cap}</div></div>`;
    }).join('');
  }
  async function loadCats(){
    const cats=await(await api('/api/categorias')).json();
    $('catChips').innerHTML=`<div class="chip ${cat===''?'on':''}" onclick="setCat('')">Todas</div>`+
      cats.map(c=>`<div class="chip ${cat===c?'on':''}" onclick="setCat('${c}')">${c}</div>`).join('');
    const E=[['','Todos'],['OK','OK'],['BAJO','Bajo'],['CRITICO','Crítico']];
    $('estadoChips').innerHTML=E.map(([v,l])=>`<div class="chip ${estado===v?'on':''}" onclick="setEstado('${v}')">${l}</div>`).join('');
  }
  function setCat(c){cat=c;loadCats();loadMats();}
  function setEstado(e){estado=e;loadCats();loadMats();}

  async function loadMats(){
    const qs=new URLSearchParams({q:$('q').value,categoria:cat,estado,size:'100'});
    const d=await(await api('/api/materiales?'+qs)).json();
    const bcls={OK:'b-ok',BAJO:'b-bajo',CRITICO:'b-crit'}, bcol={OK:'var(--emerald)',BAJO:'var(--amber)',CRITICO:'var(--coral)'};
    $('matList').innerHTML = d.items.length ? d.items.map(m=>{
      const pct=Math.min(100,Math.round(m.stock/Math.max(1,m.punto_reorden*2)*100));
      return `<div class="mat">
        <div>
          <div class="nm">${m.nombre}</div>
          <div class="meta"><span class="code">${m.codigo}</span><span>${m.categoria}</span><span>· ${m.ubicacion}</span><span>· ${cop(m.costo_unitario)}/${m.unidad}</span></div>
          <div class="bar"><i style="width:${pct}%;background:${bcol[m.estado]}"></i></div>
        </div>
        <div class="right">
          <span class="badge ${bcls[m.estado]}"><span class="dot"></span>${m.estado}</span>
          <div class="stock">${m.stock} <small>${m.unidad}</small></div>
          <div class="val-tag">${cop(m.valor_stock)}</div>
        </div></div>`;
    }).join('') : '<div class="empty">Sin resultados para el filtro actual.</div>';
    // llenar el select de movimientos (todos, sin filtro de estado)
    const all=await(await api('/api/materiales?size=100')).json();
    $('mMat').innerHTML=all.items.map(m=>`<option value="${m.id}">${m.codigo} — ${m.nombre} (stock ${m.stock})</option>`).join('');
  }

  async function loadAlertas(){
    const d=await(await api('/api/reportes/stock-bajo')).json();
    $('repoVal').textContent=d.total?('Reposición: '+cop(d.valor_reposicion)):'';
    $('alertList').innerHTML = d.materiales.length ? d.materiales.map(m=>`
      <div class="alert ${m.estado==='CRITICO'?'':'bajo'}">
        <div class="ai"><svg class="ic"><use href="#i-alert"/></svg></div>
        <div><div class="nm">${m.nombre} <span class="badge ${m.estado==='CRITICO'?'b-crit':'b-bajo'}" style="margin-left:4px"><span class="dot"></span>${m.estado}</span></div>
          <div class="ds">${m.codigo} · stock ${m.stock} / reorden ${m.punto_reorden} · ${m.ubicacion}</div>
          <div class="sug">▲ Reponer +${m.sugerencia_compra} ${m.unidad} (${cop(m.sugerencia_compra*m.costo_unitario)})</div></div>
      </div>`).join('') : '<div class="empty"><svg class="ic"><use href="#i-check"/></svg>Todo por encima del punto de reorden.</div>';
  }

  async function loadHist(){
    const rows=await(await api('/api/movimientos?limit=8')).json();
    const ic={entrada:'i-up',salida:'i-down',traslado:'i-pin',ajuste:'i-sliders'};
    const sign={entrada:'+',salida:'−',traslado:'→',ajuste:'='};
    $('histList').innerHTML=rows.map(m=>`
      <div class="mv">
        <div class="ti t-${m.tipo}"><svg class="ic" style="width:16px;height:16px"><use href="#${ic[m.tipo]}"/></svg></div>
        <div><div class="tx">${m.nombre} <span style="color:var(--faint);font-weight:500">· ${m.tipo}</span></div><div class="sb">${m.codigo} · ${m.usuario}${m.motivo?' · '+m.motivo:''}</div></div>
        <div class="q">${sign[m.tipo]}${m.cantidad}</div>
        <div class="dt">${(m.fecha||'').slice(5,16).replace('T',' ')}</div>
      </div>`).join('') || '<div class="empty">Sin movimientos.</div>';
  }

  function setTipo(t){tipo=t;document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
    $('lblCant').textContent = t==='ajuste'?'Stock contado':'Cantidad';}

  async function registrar(){
    const body={material_id:Number($('mMat').value),tipo,cantidad:Number($('mCant').value),ubicacion:$('mUbic').value,motivo:$('mMot').value};
    const r=await api('/api/movimientos',{method:'POST',body:JSON.stringify(body)});
    const d=await r.json();
    if(!r.ok){toast('err',d.error+' — integridad: el stock no cambió.');return;}
    toast(d.alerta?'warn':'ok',`${d.material.nombre}: stock ahora ${d.material.stock}.`+(d.alerta?' ⚠ '+d.alerta:''));
    $('mMot').value='';
    await Promise.all([loadDash(),loadMats(),loadAlertas(),loadHist()]);
  }

  let tmr; function debouncedLoad(){clearTimeout(tmr);tmr=setTimeout(loadMats,280);}

  function toast(kind,msg){
    const ic={ok:'i-check',err:'i-alert',warn:'i-alert'}[kind];
    const el=document.createElement('div');el.className='toast '+kind;
    el.innerHTML=`<div class="ti"><svg class="ic"><use href="#${ic}"/></svg></div><div class="msg">${msg}</div>`;
    $('toasts').appendChild(el);
    setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),350);},4200);
  }

  // Enter para login
  $('p').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
</script>
</body>
</html>
